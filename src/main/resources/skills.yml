    knockback-vertical: 0.5
    max-range: 15
    decay-min-multiplier: 0.2
    sound:
      id: "entity.warden.sonic_boom"
      volume: 1.8
    sound-at-player: true
    particle-sonic-boom: true
    particle-ray-density: 20

  swap:
    display: "<#cc99ff>移形</#cc99ff>"
