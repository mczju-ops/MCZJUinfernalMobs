# InfernalMobs 全局配置。技能、区域和消息分别位于独立文件
config-version: 1

# 也可使用 /im debug on|off 临时覆盖，重载后恢复此处设置
debug: false

# 最终经验 = 原版经验 x 炒鸡怪等级 x exp-multiplier；0 表示不修改
exp-multiplier: 5.0

# 会将怪物改造为炒鸡怪的世界
enabled-worlds:
  - SuperResource
  - Abyssal01
  - Abyssal02

# 这些情况下生成的怪物会被改造成炒鸡怪
infernal-spawn-reasons:
  - NATURAL # 自然生成
  - REINFORCEMENTS # 增援
  - TRIAL_SPAWNER # 试炼刷怪笼

# 上述条件下，这些生物会被改造为炒鸡怪，空列表表示不限制
allow-types:
  - PUFFERFISH
  - BOGGED
  - CREEPER
  - GUARDIAN
  - HUSK
  - PILLAGER
  - SKELETON
  - STRAY
  - WITCH
  - ZOMBIE
  - ZOMBIE_VILLAGER
  - CAVE_SPIDER
  - DROWNED
  - SPIDER
  - PARCHED

# 定期移除远离所有玩家的炒鸡动物，动物类型由 Bukkit API 的 Animals 接口判定。
# 此功能不读取 messages.yml 中 protected-animals.types；两者用途独立。
animal-cleanup:
  enabled: true
  interval-ticks: 100 # 检查间隔（必须是 5 的倍数）；20 tick = 1 秒，100 tick 约 5 秒
  max-distance: 128.0 # 与最近玩家的最大距离（方块）
