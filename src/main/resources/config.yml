# InfernalMobs 全局配置。技能、区域和消息分别位于独立文件
config-version: 1

# 也可使用 /im debug on|off 临时覆盖，重载后恢复此处设置
debug: false

# 最终经验 = 原版经验 x 炒鸡怪等级 x exp-multiplier；0 表示不修改
exp-multiplier: 5.0

# 会将怪物改造为炒鸡怪的世界
enabled-worlds:
  - SuperResource
  - Abyssal01
  - Abyssal02

# 这些情况下生成的怪物会被改造成炒鸡怪
infernal-spawn-reasons:
  - NATURAL # 自然生成
  - REINFORCEMENTS # 增援
  - TRIAL_SPAWNER # 试炼刷怪笼

# 上述条件下，这些生物会被改造为炒鸡怪，空列表表示不限制
allow-types:
  - PUFFERFISH
  - BOGGED
  - CREEPER
  - GUARDIAN
  - HUSK
  - PILLAGER
  - SKELETON
  - STRAY
  - WITCH
  - ZOMBIE
  - ZOMBIE_VILLAGER
  - CAVE_SPIDER
  - DROWNED
  - SPIDER
  - PARCHED
